<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justin Chao — Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --font-system: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --paper: #F8F8F8;
    --ink: #14151A;
    --ink-soft: #4A4C55;
    --mute: #8A8D93;
    --blue: #3355FF;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    overflow:hidden; /* no real scrolling — the stage is fully fixed and self-driven */
  }

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-system);
    cursor:auto;
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  /* STAGE — fixed, fills the viewport, never scrolls */
  .navbar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:5000;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:44px;
    padding:97px 48px 32px;
    pointer-events:none;
  }
  .navbar span{
    font-family:var(--font-system);
    font-weight:400;
    font-size:16px;
    color:var(--mute);
    pointer-events:auto;
  }
  .stack-stage{
    position:fixed;
    inset:0;
  }

  .stack-card{
    position:absolute;
    top:49%;
    left:50%;
    width:min(960px, 94vw);
    height:min(460px, 62vh);
    border-radius:20px;
    background:#FFFFFF;
    transform-origin:center center;
    will-change:transform, opacity, filter;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:32px;
  }

  .stack-card .card-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--blue);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:8px;
  }
  .stack-card h3{
    font-weight:700;
    font-size:26px;
    letter-spacing:-.01em;
  }

  /* HERO CARD — floating name over a ripple canvas */
  .hero-card{
    overflow:hidden;
    justify-content:center;
    align-items:center;
    padding:0;
  }
  .video-frame{
    position:absolute;
    inset:0;
  }
  .card-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .card-video.video-contain{
    object-fit:contain;
  }
  .video-depth-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
  }
  .video-caption-gloss{
    position:absolute;
    left:44px; bottom:44px;
    display:flex;
    pointer-events:auto;
  }
  .video-caption{
    text-align:left;
    display:inline-block;
    background:rgb(127,204,38);
    border-radius:14px;
    padding:14px 22px;
    cursor:pointer;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.3);
    transition:background .25s ease, box-shadow .25s ease;
  }
  .video-caption:hover{
    background:rgb(112,188,26);
    box-shadow:0 10px 28px -8px rgba(0,0,0,.36);
  }
  .video-caption.purple-variant{
    background:rgb(90,58,168);
  }
  .video-caption.purple-variant:hover{
    background:rgb(74,45,142);
  }
  .video-caption.brown-variant{
    background:rgb(255,190,110);
  }
  .video-caption.brown-variant:hover{
    background:rgb(245,175,90);
  }
  .video-caption-title-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .video-caption-logo-box{
    background:#fff;
    border-radius:6px;
    padding:4px 6px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .video-caption-logo-box.coffee-brown{
    background:rgb(111,78,55);
  }
  .video-caption-logo{
    height:22px;
    width:auto;
    display:block;
  }
  .video-caption-title{
    font-family:'Geist', var(--font-system);
    font-weight:400;
    font-size:22px;
    color:#fff;
    letter-spacing:-.02em;
    white-space:nowrap;
  }
  .video-caption-expand{
    display:grid;
    grid-template-rows:0fr;
    grid-template-columns:0fr;
    justify-items:start;
    min-width:0;
    min-height:0;
    transition:grid-template-rows .35s ease, grid-template-columns .35s ease;
  }
  .video-caption-expand-inner{
    overflow:hidden;
  }
  .video-caption:hover .video-caption-expand{
    grid-template-rows:1fr;
    grid-template-columns:1fr;
  }
  .video-caption-sub{
    font-family:'Geist', var(--font-system);
    font-weight:500;
    font-size:17px;
    color:rgba(255,255,255,0.92);
    margin-top:8px;
    line-height:1.4;
    letter-spacing:-.01em;
    white-space:normal;
    max-width:280px;
    width:max-content;
    text-align:left;
  }
  .ripple-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:inherit;
    display:block;
  }
  .hero-content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    pointer-events:none;
  }
  .floating-name{
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .floating-name .letter{
    display:inline-block;
    font-weight:700;
    font-size:clamp(38px, 6vw, 68px);
    letter-spacing:-.01em;
    color:#fff;
    background:var(--blue);
    will-change:transform;
    margin:0 2px;
    padding:0 3px;
    border-radius:2px;
  }
  .floating-name .space{ width:.5em; }
  .hero-greeting{
    margin-bottom:6px;
    font-family:var(--font-system);
    font-weight:200;
    font-size:clamp(16px, 2vw, 22px);
    letter-spacing:.03em;
    color:var(--ink-soft);
  }
  .hero-tagline{
    margin-top:14px;
    font-family:var(--font-system);
    font-weight:200;
    font-size:clamp(14px, 1.6vw, 18px);
    letter-spacing:.04em;
    color:var(--ink-soft);
  }
</style>
</head>
<body>

<nav class="navbar">
  <span>About</span>
  <span>Projects</span>
  <span>Resume</span>
</nav>

        <span class="letter">C</span><span class="letter">h</span><span class="letter">a</span><span class="letter">o</span>

<script>
  const cards = Array.from(document.querySelectorAll('.stack-card'));
  const cardVideos = cards.map(card => card.querySelector('video'));
  const cardOverlays = cards.map(card => card.querySelector('.video-depth-overlay'));
  let previousFrontIndex = null;
  const N = cards.length;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STEP_DURATION = 800; // ms

  let displayPos = 0; // continuous, unbounded — increases/decreases forever as the deck cycles
  let animating = false;

  function easeInOutCubic(t){
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // color stops: front (white) -> depth 1 (grey) -> depth 2 (darker grey)
  const COLOR_STOPS = [
    [0xFF, 0xFF, 0xFF],
    [0xEC, 0xEC, 0xEC],
    [0x1A, 0x1A, 0x1A],
  ];
  function colorForDepth(depth){
    const d = Math.max(0, Math.min(depth, 2));
    const i = Math.min(Math.floor(d), 1); // segment index: 0 (white->grey1) or 1 (grey1->grey2)
    const t = d - i;
    const a = COLOR_STOPS[i], b = COLOR_STOPS[i + 1];
    const r = Math.round(a[0] + (b[0] - a[0]) * t);
    const g = Math.round(a[1] + (b[1] - a[1]) * t);
    const bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return `rgb(${r}, ${g}, ${bl})`;
  }

  function render(){
    cards.forEach((card, j) => {
      const raw = displayPos - j;
      // wrap into [0, N) so the deck cycles infinitely instead of running out of cards
      const wrapped = ((raw % N) + N) % N;

      let translateY, scale, scaleX, opacity, grayscale, rotate = 0, bg, z, overlayOpacity;

      if (wrapped < 1) {
        // this card is currently front-and-throwing
        const m = wrapped;
        const FADE_START = 0.6;
        const fadeM = m < FADE_START ? 0 : (m - FADE_START) / (1 - FADE_START);
        translateY = -m * 60;
        scale = 1 - m * 0.15;
        scaleX = scale;
        opacity = 1 - fadeM;
        grayscale = fadeM * 100;
        rotate = m * 8;
        bg = colorForDepth(0); // white, matching the depth-0 end of the gradient
        z = 3000; // always renders above the waiting stack while it's leaving
        overlayOpacity = fadeM; // video shows normally while front; fades to solid color as it throws away
      } else {
        // waiting in the stack behind — position/scale freeze once capped at depth 3,
        // acting as a fixed anchor. Always fully opaque: identical cards further back
        // sit perfectly hidden underneath it until it's their turn to move forward.
        const rawDepth = N - wrapped;
        const depth = Math.min(rawDepth, 2); // 3 cards total visible: front + 2 behind
        translateY = depth * 4.5;
        scale = 1 - depth * 0.045;
        scaleX = scale * (1 - depth * 0.06); // extra horizontal shrink — corners peek out more distinctly
        opacity = 1;
        grayscale = 0;
        bg = colorForDepth(depth); // continuous — no snapping between color stops
        z = 2000 - Math.round(depth * 100); // shallower depth (closer to front) stacks on top
        overlayOpacity = Math.min(1, depth / 0.4); // once behind the front, quickly covers the video with matching grey/black
      }

      card.style.transform = `translate(-50%, calc(-50% + ${translateY}vh)) rotate(${rotate}deg) scaleX(${scaleX}) scaleY(${scale})`;
      card.style.backgroundColor = bg;
      card.style.opacity = opacity;
      card.style.filter = `grayscale(${grayscale}%)`;
      card.style.zIndex = z;

      const overlay = cardOverlays[j];
      if (overlay) {
        overlay.style.backgroundColor = bg;
        overlay.style.opacity = overlayOpacity;
      }
    });

    // only play a card's video once it's actually the settled front card —
    // keeps videos from silently looping in the background and guarantees
    // you see each one's intro from the start
    const frontIndex = ((Math.round(displayPos) % N) + N) % N;
    if (frontIndex !== previousFrontIndex) {
      if (previousFrontIndex !== null) {
        const prevVideo = cardVideos[previousFrontIndex];
        if (prevVideo) prevVideo.pause();
      }
      const newVideo = cardVideos[frontIndex];
      if (newVideo) {
        newVideo.currentTime = 0;
        newVideo.play().catch(() => {});
      }
      previousFrontIndex = frontIndex;
    }
  }

  function animateTo(target, duration){
    const startVal = displayPos;
    const delta = target - startVal;
    const startTime = performance.now();
    animating = true;

    function frame(now){
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      const eased = easeInOutCubic(t);
      displayPos = startVal + delta * eased;
      render();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        displayPos = target;
        render();
        animating = false;
      }
    }
    requestAnimationFrame(frame);
  }

  function step(dir){
    if (animating) return;
    const target = Math.round(displayPos) + dir;
    if (reduceMotion) {
      displayPos = target;
      render();
    } else {
      animateTo(target, STEP_DURATION);
    }
  }

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    step(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  });

  let touchStartY = null;
  window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (touchStartY === null) return;
    const dy = touchStartY - e.touches[0].clientY;
    if (Math.abs(dy) < 30) return;
    e.preventDefault();
    step(dy > 0 ? 1 : -1);
    touchStartY = null;
  }, { passive: false });

  // ---- Hero card: floating letters over a fishtank of rising bubbles ----
  const heroCanvas = document.getElementById('rippleCanvas');
  const heroName = document.getElementById('floatingName');

  if (heroCanvas && heroName && !reduceMotion) {
    const ctx = heroCanvas.getContext('2d');

    function resizeHeroCanvas(){
      const rect = heroCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      heroCanvas.width = Math.max(1, Math.round(rect.width * dpr));
      heroCanvas.height = Math.max(1, Math.round(rect.height * dpr));
    }
    resizeHeroCanvas();
    window.addEventListener('resize', resizeHeroCanvas);

    let bubbles = [];
    function spawnBubble(){
      const w = heroCanvas.width, h = heroCanvas.height;
      bubbles.push({
        x: Math.random() * w,
        y: h + 10,
        r: (2 + Math.random() * 4) * (w / 400), // scale roughly with canvas size
        speed: (18 + Math.random() * 22) * (h / 400),
        wobbleAmp: 4 + Math.random() * 8,
        wobbleSpeed: 1 + Math.random() * 1.2,
        wobblePhase: Math.random() * Math.PI * 2,
        life: 0,
        popping: false,
        popStart: 0,
      });
    }

    let cursorX = null, cursorY = null;
    heroCanvas.addEventListener('mousemove', (e) => {
      const rect = heroCanvas.getBoundingClientRect();
      const scaleX = heroCanvas.width / rect.width;
      const scaleY = heroCanvas.height / rect.height;
      cursorX = (e.clientX - rect.left) * scaleX;
      cursorY = (e.clientY - rect.top) * scaleY;
    });
    heroCanvas.addEventListener('mouseleave', () => { cursorX = null; cursorY = null; });

    const POP_DURATION = 0.22; // seconds
    heroCanvas.addEventListener('click', (e) => {
      const rect = heroCanvas.getBoundingClientRect();
      const scaleX = heroCanvas.width / rect.width;
      const scaleY = heroCanvas.height / rect.height;
      const cx = (e.clientX - rect.left) * scaleX;
      const cy = (e.clientY - rect.top) * scaleY;
      const now = performance.now() / 1000;
      // pop the nearest hit bubble rather than every overlapping one — feels more precise
      let closest = null, closestDist = Infinity;
      bubbles.forEach(b => {
        if (b.popping) return;
        const dx = b.x - cx, dy = b.y - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist <= b.r * 1.6 && dist < closestDist) { closest = b; closestDist = dist; }
      });
      if (closest) { closest.popping = true; closest.popStart = now; }
    });

    let lastSpawn = -Infinity;
    const SPAWN_INTERVAL = 0.55; // seconds, with jitter applied at spawn time
    let nextInterval = SPAWN_INTERVAL;
    let lastFrameTime = null;

    function drawBubble(b, t){
      if (b.popping) {
        const popT = Math.min((t - b.popStart) / POP_DURATION, 1);
        const ringR = b.r * (1 + popT * 1.8);
        const alpha = (1 - popT) * 0.6;
        ctx.beginPath();
        ctx.strokeStyle = `rgba(190,210,225,${alpha})`;
        ctx.lineWidth = Math.max(1, b.r * 0.25 * (1 - popT * 0.6));
        ctx.arc(b.x, b.y, ringR, 0, Math.PI * 2);
        ctx.stroke();
        return;
      }
      const alphaIn = Math.min(b.life / 0.4, 1);
      const alphaOut = Math.min((heroCanvas.height - b.y) / 40, 1); // fade as it nears the top
      const alpha = Math.min(alphaIn, alphaOut) * 0.55;
      const grad = ctx.createRadialGradient(
        b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1,
        b.x, b.y, b.r
      );
      grad.addColorStop(0, `rgba(250,253,255,${alpha})`);
      grad.addColorStop(0.6, `rgba(205,228,245,${alpha * 0.6})`);
      grad.addColorStop(1, `rgba(160,190,215,${alpha * 0.2})`);
      ctx.beginPath();
      ctx.fillStyle = grad;
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      // small highlight for a glassy look
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.8})`;
      ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }

    const letters = Array.from(heroName.querySelectorAll('.letter'));
    const letterState = letters.map((el, i) => ({
      el,
      phase: Math.random() * Math.PI * 2,
      speed: 0.38 + Math.random() * 0.16,
      ampY: 5.5 + Math.random() * 2.5,
      ampX: 1.8 + Math.random() * 1.3,
      ampR: 1.5 + Math.random() * 1.6,
      dispX: 0, dispY: 0, // cursor-pushed displacement, in canvas pixel space
      velX: 0, velY: 0,
      entranceDelay: i * 65, // ms — staggers the rise so letters don't arrive all at once
      splashed: false,
    }));

    const ENTRANCE_DURATION = 650; // ms
    const ENTRANCE_RISE = 85; // px — how far below rest position each letter starts
    const pageLoadTime = performance.now();

    function easeOutBack(t){
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function spawnSplashBurst(canvasX, canvasY){
      const w = heroCanvas.width;
      for (let i = 0; i < 5; i++){
        bubbles.push({
          x: canvasX + (Math.random() - 0.5) * 24 * (w / 400),
          y: canvasY + (Math.random() - 0.5) * 10 * (w / 400),
          r: (1.5 + Math.random() * 3) * (w / 400),
          speed: (40 + Math.random() * 50) * (w / 400), // faster burst than ambient bubbles
          wobbleAmp: 6 + Math.random() * 6,
          wobbleSpeed: 2 + Math.random() * 1.5,
          wobblePhase: Math.random() * Math.PI * 2,
          life: 0,
          popping: false,
          popStart: 0,
        });
      }
    }

    const PUSH_RADIUS = 70;   // canvas px — how close the cursor needs to be to shove a letter
    const PUSH_STRENGTH = 900; // how hard the shove is
    const SPRING_K = 90;       // how strongly it's pulled back to its resting spot
    const SPRING_DAMPING = 11; // higher = settles faster, lower = more bounce/overshoot

    function heroFrame(now){
      const t = now / 1000;
      if (lastFrameTime === null) lastFrameTime = t;
      const dt = Math.min(t - lastFrameTime, 0.05);
      lastFrameTime = t;

      const canvasRect = heroCanvas.getBoundingClientRect();
      const scaleX = canvasRect.width > 0 ? heroCanvas.width / canvasRect.width : 1;
      const scaleY = canvasRect.height > 0 ? heroCanvas.height / canvasRect.height : 1;

      letterState.forEach(s => {
        const bobY = Math.sin(t * s.speed + s.phase) * s.ampY;
        const bobX = Math.sin(t * s.speed * 0.7 + s.phase + 1.3) * s.ampX;
        const rot = Math.sin(t * s.speed * 0.5 + s.phase) * s.ampR;

        // entrance: letter rises up from below with a slight bounce-settle, staggered per letter
        const elapsed = now - pageLoadTime - s.entranceDelay;
        let entranceY = 0, entranceOpacity = 1;
        if (elapsed < 0) {
          entranceY = ENTRANCE_RISE;
          entranceOpacity = 0;
        } else if (elapsed < ENTRANCE_DURATION) {
          const progress = elapsed / ENTRANCE_DURATION;
          const eased = easeOutBack(progress);
          entranceY = ENTRANCE_RISE * (1 - eased);
          entranceOpacity = Math.min(1, elapsed / 140);
        } else if (!s.splashed) {
          s.splashed = true;
          if (canvasRect.width > 0) {
            const r = s.el.getBoundingClientRect();
            const lx = (r.left + r.width / 2 - canvasRect.left) * scaleX;
            const ly = (r.bottom - canvasRect.top) * scaleY;
            spawnSplashBurst(lx, ly);
          }
        }

        // cursor moving through the water shoves nearby letters off course
        if (cursorX !== null && canvasRect.width > 0 && elapsed >= ENTRANCE_DURATION) {
          const r = s.el.getBoundingClientRect();
          const lx = (r.left + r.width / 2 - canvasRect.left) * scaleX;
          const ly = (r.top + r.height / 2 - canvasRect.top) * scaleY;
          const dx = lx - cursorX, dy = ly - cursorY;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < PUSH_RADIUS && dist > 0.001) {
            const force = (1 - dist / PUSH_RADIUS) * PUSH_STRENGTH;
            s.velX += (dx / dist) * force * dt;
            s.velY += (dy / dist) * force * dt;
          }
        }

        // spring pulls the letter back to its natural resting position — settles naturally, no snapping
        s.velX += (-SPRING_K * s.dispX - SPRING_DAMPING * s.velX) * dt;
        s.velY += (-SPRING_K * s.dispY - SPRING_DAMPING * s.velY) * dt;
        s.dispX += s.velX * dt;
        s.dispY += s.velY * dt;

        const dispXcss = s.dispX / scaleX;
        const dispYcss = s.dispY / scaleY;

        s.el.style.opacity = entranceOpacity;
        s.el.style.transform = `translate(${bobX + dispXcss}px, ${bobY + dispYcss + entranceY}px) rotate(${rot}deg)`;
      });

      if (canvasRect.width > 0) {
        if (t - lastSpawn >= nextInterval) {
          spawnBubble();
          lastSpawn = t;
          nextInterval = SPAWN_INTERVAL + (Math.random() - 0.5) * 0.4;
        }

        ctx.clearRect(0, 0, heroCanvas.width, heroCanvas.height);
        bubbles.forEach(b => {
          if (!b.popping) {
            b.life += dt;
            b.y -= b.speed * dt;
            b.x += Math.sin(t * b.wobbleSpeed + b.wobblePhase) * b.wobbleAmp * dt;
          }
          drawBubble(b, t);
        });
        bubbles = bubbles.filter(b => b.popping ? (t - b.popStart) < POP_DURATION : b.y > -20);
      }

      requestAnimationFrame(heroFrame);
    }
    requestAnimationFrame(heroFrame);
  }

  render();
</script>

</body>
</html>
