<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 36" width="440" height="360" role="img" aria-label="JC monogram">
  <g fill="none" stroke="#14151A" stroke-linecap="round" stroke-linejoin="round">
    <!-- C: true circle, left edge tangent to the J stem so the two never cross -->
    <path d="M39 25.4 A14 14 0 1 1 39 8.6" stroke-width="3.2"/>
    <!-- J: stem sits on the circle's leftmost point, hook clears the C's lower arc -->
    <path d="M13.5 4 V23 A7.5 7.5 0 0 1 6 30.5 H4" stroke-width="3.2"/>
    <!-- two eyes -->
    <path d="M24.9 17.4 Q27.1 15.2 29.3 17.4" stroke-width="2.4"/>
    <path d="M33.3 17.4 Q35.5 15.2 37.7 17.4" stroke-width="2.4"/>
  </g>
</svg>
